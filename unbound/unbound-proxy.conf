# Отдельный резолвер ТОЛЬКО для proxy-net (Hysteria2 + Xray).
#
# Зачем нужен отдельный экземпляр, а не общий с VPN:
# Первая версия этой схемы подключала основной unbound сразу к двум сетям.
# Ревью показало, что это дыра: у контейнера появлялся живой адрес 10.2.0.100
# в подсети, из которой ufw пускает SSH, и прямой доступ к Vaultwarden на
# 10.2.0.4. ACL внутри Hysteria/Xray тут бесполезны — они ограничивают трафик
# КЛИЕНТА, а не то, куда может ходить сам процесс unbound. При этом резолвер
# обрабатывает данные, полностью подконтрольные клиенту: любой владелец
# учётки может заставить его сходить на свой авторитативный сервер и вернуть
# произвольный ответ. Поэтому резолвер для прокси живёт в своей сети и ноги
# в vpn-net не имеет вовсе.
#
# Файл подключается механизмом include-toplevel: /etc/unbound/custom.conf.d/*.conf
# и дополняет базовый конфиг образа, а не заменяет его.
#
# Образ klutchell/unbound (а не mvance): mvance не обновлялся с 2024-10-19 и
# везёт Unbound 1.22.0. Для резолвера, разбирающего подконтрольный клиенту
# ввод, устаревшая версия неприемлема.

server:
    # --- Доступ: только proxy-net -------------------------------------------
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.4.0.0/24 allow

    # --- Защита от злоупотребления ------------------------------------------
    # Резолвер обслуживает менее доверенную популяцию, чем вручную заведённые
    # WireGuard-пиры. Без лимитов один шумный клиент просаживает 2 vCPU.
    ratelimit: 1000
    ip-ratelimit: 200

    # --- Приватность и устойчивость -----------------------------------------
    # Полная рекурсия от корня: forward-zone намеренно НЕТ. Смысл собственного
    # резолвера теряется, если он пересказывает все запросы публичному провайдеру.
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    use-caps-for-id: yes

    do-ip6: no

    # --- Защита от DNS rebinding --------------------------------------------
    # Второй рубеж поверх ACL прокси: даже если клиент подсунет домен,
    # резолвящийся в приватный адрес, ответ будет отброшен.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 127.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    # --- Кэш (скромный: контейнер делит 2 vCPU со всем остальным) -----------
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    msg-cache-size: 32m
    rrset-cache-size: 64m
