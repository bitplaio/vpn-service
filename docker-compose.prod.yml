services:
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    volumes:
      - ./unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks:
      vpn-net:
        ipv4_address: 10.2.0.100
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "drill @127.0.0.1 cloudflare.com > /dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - SERVERURL=${SERVERURL}
      - SERVERPORT=${SERVERPORT:-443}
      - PEERS=${PEERS:-1}
      - PEERDNS=${PEERDNS:-10.2.0.100}
      - INTERNAL_SUBNET=${INTERNAL_SUBNET:-10.13.13.0}
      - ALLOWEDIPS=0.0.0.0/0,::/0
      - LOG_CONFS=true
    volumes:
      - wireguard-config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${SERVERPORT:-443}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      vpn-net:
    depends_on:
      unbound:
        condition: service_healthy

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    environment:
      - DOMAIN=https://vault.halobolan.cc
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - LOG_LEVEL=warn
      - WEBSOCKET_ENABLED=true
    volumes:
      - vaultwarden-data:/data
    networks:
      vpn-net:
        ipv4_address: 10.2.0.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      vpn-net:
        ipv4_address: 10.2.0.5
    depends_on:
      vaultwarden:
        condition: service_healthy

  # --- Параллельный стек: Hysteria2 + VLESS-REALITY ---------------------------
  # Выделенный резолвер для proxy-net. Основной unbound СОЗНАТЕЛЬНО остаётся
  # только в vpn-net: подключение одного резолвера к обеим сетям давало
  # контейнеру живой адрес в подсети, из которой ufw пускает SSH, и прямой
  # путь к Vaultwarden. Подробности — в unbound/unbound-proxy.conf.
  unbound-proxy:
    image: klutchell/unbound:1.25.2
    container_name: unbound-proxy
    volumes:
      # Штатный механизм расширения образа; базовый конфиг не затирается.
      - ./unbound/unbound-proxy.conf:/etc/unbound/custom.conf.d/proxy.conf:ro
    networks:
      proxy-net:
        ipv4_address: 10.4.0.100
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Образ стартует под root и понижает привилегии до пользователя unbound.
      # С голым `cap_drop: ALL` он падает в цикле рестартов:
      #   fatal error: unable to set group id of unbound: Operation not permitted
      # Эти две capability — минимум, достаточный для понижения привилегий;
      # проверено подбором на живом контейнере. Порт 53 внутри контейнера
      # занимается без CAP_NET_BIND_SERVICE, потому что у docker
      # net.ipv4.ip_unprivileged_port_start = 0.
      - SETGID
      - SETUID
    healthcheck:
      # Образ distroless — shell отсутствует, только exec-форма.
      test: ["CMD", "/usr/bin/drill", "@127.0.0.1", "cloudflare.com"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Оба прокси живут в ОТДЕЛЬНОЙ сети proxy-net и не имеют доступа к vpn-net.
  # Это структурная защита: ufw пускает 22/tcp из 10.2.0.0/24, а Vaultwarden на
  # 10.2.0.4 закрыт только Cloudflare Access на периферии. Прокси в той же сети
  # означал бы доступ к SSH и к /admin Vaultwarden в обход Access.
  # Второй рубеж — ACL внутри самих конфигов (см. hysteria/config.yaml.example
  # и xray/config.json.example).

  hysteria:
    image: tobyxdd/hysteria:v2.12.1
    container_name: hysteria
    command: server -c /etc/hysteria/config.yaml
    volumes:
      - ./hysteria/config.yaml:/etc/hysteria/config.yaml:ro
      - ./hysteria/certs:/certs:ro
    ports:
      - "8443:8443/udp"
    networks:
      proxy-net:
        ipv4_address: 10.4.0.20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Проверяем, что UDP-сокет реально занят, а не просто что бинарник живой.
      test: ["CMD-SHELL", "netstat -lun | grep -q ':8443'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      unbound-proxy:
        condition: service_healthy

  xray:
    image: ghcr.io/xtls/xray-core:26.7.28
    container_name: xray
    # ОБЯЗАТЕЛЬНО. Образ distroless, его CMD — `-confdir /usr/local/etc/xray/`,
    # и в этом каталоге уже лежит дефолтный конфиг. Без переопределения на
    # -config наш файл не читается ВООБЩЕ: контейнер поднимется «здоровым»,
    # а REALITY-инбаунда в нём не будет.
    command: ["-config", "/etc/xray/config.json"]
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro
    ports:
      # 443/tcp и 443/udp не конфликтуют: у ядра раздельные таблицы сокетов,
      # а правила DNAT у docker квалифицированы по протоколу. WireGuard на
      # 443/udp остаётся нетронутым. REALITY требует именно 443 — на другом
      # порту Xray пишет предупреждение о риске блокировки.
      - "443:443/tcp"
    networks:
      proxy-net:
        ipv4_address: 10.4.0.30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Образ distroless — shell отсутствует, поэтому только exec-форма.
      # Бинарник лежит в /usr/local/bin/xray, НЕ в /usr/bin/xray.
      test: ["CMD", "/usr/local/bin/xray", "version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      unbound-proxy:
        condition: service_healthy

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.2.0.0/24
  proxy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.4.0.0/24

volumes:
  wireguard-config:
  vaultwarden-data:
